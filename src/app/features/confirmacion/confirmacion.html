<main class="container contenido-principal d-flex flex-column align-items-center justify-content-center" style="min-height: 70vh;">

    <div class="text-center mb-4 mt-5">
        <div class="display-1 text-success mb-3">
            <i class="bi bi-check-circle-fill"></i>
        </div>
        <h1 class="fw-bold text-success">¡Pago Exitoso!</h1>
        <h4 class="text-muted">Tu reserva ha sido confirmada.</h4>
    </div>

    <div class="card shadow border-0 text-center p-4 p-md-5 mb-4" style="max-width: 500px; width: 100%;">
        <h5 class="fw-bold mb-3">Resumen de tu Cita</h5>
        <p class="fs-5 mb-1">Has contratado a: <strong class="text-primary">{{ nombreProfesional }}</strong></p>
        <p class="text-muted mb-4">Tiempo restante para tu servicio:</p>

        <!-- Aquí imprimimos el reloj en vivo -->
        <div class="display-5 fw-bold text-dark bg-light rounded-4 py-3 border mb-4 font-monospace">
            {{ tiempoRestante }}
        </div>

        <p class="small text-muted mb-4">
            El profesional llegará a la dirección indicada en la fecha y hora acordada. 
        </p>

        <!-- Usamos routerLink en lugar de href -->
        <a routerLink="/" class="btn btn-primary fw-bold w-100 shadow-sm">Volver al Inicio</a>
    </div>

</main>

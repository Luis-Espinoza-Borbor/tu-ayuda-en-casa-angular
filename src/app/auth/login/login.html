<main class="container contenido-principal d-flex align-items-center justify-content-center my-5">
    <div class="card shadow-lg border-0 rounded-4 overflow-hidden w-100" style="max-width: 900px;">
        <div class="row g-0">
            <div class="col-md-5 d-none d-md-block p-0">
                <img src="assets/login.jpg" alt="Inicia Sesión" class="img-fluid w-100 h-100 object-fit-cover rounded-start-4">
            </div>

            <div class="col-md-7 p-4 p-md-5 bg-white">
                <div class="text-center mb-4">
                    <h3 class="fw-bold text-dark">Iniciar Sesión</h3>
                    <p class="text-muted small">Accede a tu panel de control.</p>
                </div>

                <!-- Angular se encarga del evento Submit -->
                <form (ngSubmit)="onSubmit()">
                    <div class="form-floating mb-3">
                        <input type="email" class="form-control" id="loginCorreo" name="correo" placeholder="correo@ejemplo.com" [(ngModel)]="correo" required>
                        <label for="loginCorreo">Correo Electrónico</label>
                    </div>
                    <div class="form-floating mb-4">
                        <input type="password" class="form-control" id="loginPassword" name="password" placeholder="Contraseña" [(ngModel)]="password" required>
                        <label for="loginPassword">Contraseña</label>
                    </div>

                    <!-- Botón dinámico que se deshabilita mientras carga -->
                    <button type="submit" class="btn btn-dark btn-lg w-100 fw-bold mb-3 shadow-sm" [disabled]="cargando">
                        @if (cargando) {
                            <span class="spinner-border spinner-border-sm"></span> Entrando...
                        } @else {
                            Ingresar
                        }
                    </button>

                    <div class="text-center small mb-3">
                        ¿No tienes cuenta? <a routerLink="/registro" class="text-decoration-none fw-bold text-primary">Regístrate como cliente</a>
                    </div>

                    <hr class="my-4">

                    <div class="alert alert-secondary text-center small mb-0 rounded-3">
                        <span class="fw-bold d-block mb-1">Acceso Administrador (Pruebas)</span>
                        Correo: <strong>admin@admin.com</strong><br>
                        Clave: <strong>123456</strong>
                    </div>
                </form>
            </div>
        </div>
    </div>
</main>
